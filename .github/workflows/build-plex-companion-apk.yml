name: Build Plex Companion APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/plex-companion-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct and verify Plex Companion package
        run: |
          cat .plex-build/zip.part.00a .plex-build/zip.part.00b .plex-build/zip.part.01 .plex-build/zip.part.02 .plex-build/zip.part.03 | base64 -d > PlexCompanion-Android-v1.zip
          echo "ce665cd84f7a8ec1f42f864f2543f4f9cfbc6b2f2f71f845cd02402ee15cc076  PlexCompanion-Android-v1.zip" | sha256sum -c -
          unzip -q PlexCompanion-Android-v1.zip

      - name: Build debug APK
        working-directory: PlexCompanion
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PlexCompanion-debug-apk
          path: PlexCompanion/app/build/outputs/apk/debug/app-debug.apk
