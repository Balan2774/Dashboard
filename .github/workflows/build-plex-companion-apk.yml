name: Build Plex Companion 1.2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/plex-companion-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Reconstruct and verify Plex Companion 1.2 package
        run: |
          cat .plex-build/v12.part.00 .plex-build/v12.part.01 .plex-build/v12.part.02 .plex-build/v12.part.03 .plex-build/v12.part.04 .plex-build/v12.part.05 .plex-build/v12.part.060 .plex-build/v12.part.061 .plex-build/v12.part.07 .plex-build/v12.part.08 .plex-build/v12.part.090 .plex-build/v12.part.091 | base64 -d > PlexCompanion-Android-v1.2.zip
          echo "5ca6b31b884bd7e1c4c4e48bf0ab9dc06d51875f44169ed283c0f975bf7c5f79  PlexCompanion-Android-v1.2.zip" | sha256sum -c -
          unzip -q PlexCompanion-Android-v1.2.zip

      - name: Apply SMB compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PlexCompanion/app/src/main/java/com/alan/plexcompanion/SmbTransfer.java')
          lines = p.read_text().splitlines()
          lines[91] = '        if (c.username == null || c.username.trim().isEmpty()) return base.withCredentials(new NtlmPasswordAuthenticator("", "GUEST", ""));'
          lines[135] = r'        return value.replaceAll("[<>:\"/\\\\|?*]", "_").replaceAll("\\s+", " ").trim();'
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Set permanent app identity
        run: |
          sed -i "s/applicationId 'com.alan.plexcompanion'/applicationId 'com.alan.plexcompanion.release'/" PlexCompanion/app/build.gradle
          sed -i 's/android:name=".MainActivity"/android:name="com.alan.plexcompanion.MainActivity"/' PlexCompanion/app/src/main/AndroidManifest.xml

      - name: Build unsigned release APK
        working-directory: PlexCompanion
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: PlexCompanion-v1.2-unsigned-release-apk
          path: PlexCompanion/app/build/outputs/apk/release/app-release-unsigned.apk
