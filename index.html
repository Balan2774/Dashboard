<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Hub: Quick Copy Edition</title>
    <style>
        :root { --primary: #005ea5; --bg: #f3f2f1; --card: #ffffff; --accent: #00703c; --text: #0b0c0c; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); }
        .tabs { display: flex; background: #ffffff; border-bottom: 2px solid #b1b4b6; position: sticky; top: 0; z-index: 100; }
        .tab-btn { padding: 15px 20px; border: none; background: none; cursor: pointer; font-size: 0.9rem; font-weight: bold; color: #505a5f; flex: 1; text-align: center; }
        .tab-btn.active { color: var(--primary); border-bottom: 4px solid var(--primary); margin-bottom: -2px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card); padding: 20px; border: 1px solid #b1b4b6; border-radius: 4px; }
        .btn { background: var(--primary); color: white; border: none; padding: 10px 15px; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 0.85rem; }
        .btn:hover { background: #002d18; }
        .btn-copy { background: #505a5f; }
        .btn-danger { background: #d4351c; }
        .btn-accent { background: var(--accent); }
        .lib-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #ddd; background: #fff; }
        .lib-info { font-weight: bold; font-size: 1rem; }
        .action-group { display: flex; gap: 5px; }
        /* Hidden element for rich text copying */
        #hiddenClipboard { position: absolute; left: -9999px; }
    </style>
</head>
<body>

<nav class="tabs">
    <button class="tab-btn active" onclick="openTab(event, 'calc')">Calculator</button>
    <button class="tab-btn" onclick="openTab(event, 'contacts')">Contacts</button>
    <button class="tab-btn" onclick="openTab(event, 'saved')">Saved Templates</button>
    <button class="tab-btn" onclick="openTab(event, 'email')">Composer</button>
</nav>

<div id="hiddenClipboard" contenteditable="true"></div>

<div class="container">
    <section id="calc" class="tab-content active"><div class="card"><h2>Calculator</h2><p>Calculator logic active...</p></div></section>
    <section id="contacts" class="tab-content"><div class="card"><h2>Contacts</h2><p>Contact logic active...</p></div></section>

    <section id="saved" class="tab-content">
        <div class="card">
            <h2>Template Library</h2>
            <p style="font-size:0.8rem; color:#666; margin-bottom:15px;">Use "Copy" to grab text instantly, or "Load" to edit in the Composer.</p>
            <div id="libraryItems"></div>
        </div>
    </section>

    <section id="email" class="tab-content">
        <div class="card">
            <h2>Composer</h2>
            <div id="emailBody" contenteditable="true" style="min-height:300px; border:1px solid #000; padding:10px;"></div>
            <button class="btn btn-accent" style="margin-top:10px;" onclick="saveToLibrary()">Save Current to Library</button>
        </div>
    </section>
</div>

<script>
    function openTab(e, id) {
        document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        if(e) e.currentTarget.classList.add("active");
    }

    // Direct Copy Function for Library
    async function quickCopy(index) {
        const library = JSON.parse(localStorage.getItem('payrollLibraryFinal') || '[]');
        const content = library[index].content;
        
        const blob = new Blob([content], { type: "text/html" });
        const data = [new ClipboardItem({ 
            "text/html": blob, 
            "text/plain": new Blob([content.replace(/<[^>]*>/g, '')], {type: "text/plain"}) 
        })];
        
        await navigator.clipboard.write(data);
        alert("Template '" + library[index].title + "' copied directly to clipboard!");
    }

    function renderLibrary() {
        const container = document.getElementById('libraryItems');
        const library = JSON.parse(localStorage.getItem('payrollLibraryFinal') || '[]');
        container.innerHTML = library.length ? '' : '<p>No templates yet.</p>';
        library.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'lib-item';
            div.innerHTML = `
                <span class="lib-info">${item.title}</span> 
                <div class="action-group">
                    <button class="btn btn-accent" onclick="quickCopy(${index})">Copy</button>
                    <button class="btn btn-copy" onclick="loadTemplate(${index})">Load</button>
                    <button class="btn btn-danger" onclick="deleteTemplate(${index})">X</button>
                </div>`;
            container.appendChild(div);
        });
    }

    function saveToLibrary() {
        const content = document.getElementById('emailBody').innerHTML;
        if (!content.trim()) return alert("Composer is empty!");
        const title = prompt("Template Name:");
        if (!title) return;
        const library = JSON.parse(localStorage.getItem('payrollLibraryFinal') || '[]');
        library.push({ title, content });
        localStorage.setItem('payrollLibraryFinal', JSON.stringify(library));
        renderLibrary();
    }

    function loadTemplate(index) {
        const library = JSON.parse(localStorage.getItem('payrollLibraryFinal'));
        document.getElementById('emailBody').innerHTML = library[index].content;
        openTab({currentTarget: document.querySelectorAll('.tab-btn')[3]}, 'email');
    }

    function deleteTemplate(index) {
        if(!confirm("Delete?")) return;
        const library = JSON.parse(localStorage.getItem('payrollLibraryFinal'));
        library.splice(index, 1);
        localStorage.setItem('payrollLibraryFinal', JSON.stringify(library));
        renderLibrary();
    }

    window.onload = renderLibrary;
</script>
</body>
</html>
